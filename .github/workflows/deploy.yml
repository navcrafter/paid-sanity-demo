# Builds the site and deploys it to Netlify on every push to main.
# (Netlify's own Git integration needs a paid plan for private organization repos.)
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN     Netlify personal access token
#   SANITY_API_READ_TOKEN  Same value as in .env.local. The Netlify CLI only gets a
#                          masked copy of Netlify's secret, and the build needs the real one.
# The public NEXT_PUBLIC_* values are read from the Netlify project's environment variables.

name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that is still running.
concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy
        run: npx --yes netlify-cli@27.16.2 deploy --build --prod --message "GitHub Actions ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 604ee7d8-a20a-454e-903f-8e65fc2199e4
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
