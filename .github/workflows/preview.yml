# Builds every pull request and deploys it to its own Netlify preview URL:
#   https://pr-<number>--paid-sanity-demo.netlify.app
# The URL is posted (and kept up to date) as a comment on the pull request.
#
# Uses the same repository secrets as deploy.yml (NETLIFY_AUTH_TOKEN, SANITY_API_READ_TOKEN).
# Pull requests from forks don't get secrets, so they are skipped.
#
# Previews read the Netlify project's "deploy-preview" environment context, so variables set
# for "All contexts" apply. Netlify marks non-production deploys noindex on its own.

name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same PR replaces a preview build that is still running.
concurrency:
  group: netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}--paid-sanity-demo.netlify.app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy preview
        run: >
          npx --yes netlify-cli@27.16.2 deploy --build
          --alias "$PREVIEW_ALIAS"
          --context deploy-preview
          --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 604ee7d8-a20a-454e-903f-8e65fc2199e4
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

      - name: Comment the preview URL on the PR
        if: always()
        uses: actions/github-script@v8
        env:
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- netlify-preview -->'
            const ok = process.env.OUTCOME === 'success'
            const url = process.env.PREVIEW_URL
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const body = ok
              ? `${marker}\n**Preview:** ${url}\nStudio: ${url}/studio\n\nBuilt from ${sha}.`
              : `${marker}\n**Preview build failed** for ${sha}. See the "PR preview" check for logs.`
            const {owner, repo} = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100})
            const existing = comments.find((c) => c.body && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }
